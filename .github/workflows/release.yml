name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # This fork isn't on the Marketplace: devboxes get it from the internal GitLab's package
      # registry (.gitlab-ci.yml, devbox/README.md). The GitHub release only holds the VSIX.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
          body: |
            ## Agntree for Devboxes v${{ steps.version.outputs.VERSION }}

            A fork of [Agntree](https://github.com/subhashkhileri/agntree) for Coder devboxes over Remote-SSH,
            with the extension ID `fullhousevenues.agntree`. Uninstall the Marketplace Agntree first.

            ### Installation
            1. Download the `.vsix` file below
            2. In VS Code, run `Extensions: Install from VSIX...` from the command palette
            3. Select the downloaded file

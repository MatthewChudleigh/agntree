# Agntree for Devboxes: a fork of github.com/subhashkhileri/agntree. Every pipeline builds and tests
# the extension and keeps the VSIX as an artifact. A version tag also publishes the VSIX to this
# project's generic package registry, where the devbox template fetches it at each workspace start
# (devbox/README.md).
#
# Runners: the `venues` fleet runs jobs directly on the instance (AL2023, as ec2-user; `image:` is
# ignored). Its Node version moves with the runner image, so the build runs in a pinned Node image
# from the hub's ECR pull-through, as apl-frontend does, with ECR_REGISTRY from the group's CI/CD
# variables. The full image, not -slim: the tests create git repositories.
#
# Releasing: bump "version" in package.json and the CHANGELOG, merge, then push the tag
# v<version>. Protect v* tags (Settings > Repository > Protected tags) so only Maintainers can
# publish. Then bump agntree_version in coder-templates' devbox template.

stages:
  - build
  - publish

variables:
  NODE_IMAGE: ${ECR_REGISTRY}/ecr-public/docker/library/node:22.23.3-bookworm

# Merge request pipelines for branches with an open MR, branch pipelines otherwise, and tags
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags:
    - venues

# npm ci, the type-check and unit tests (npm test), then the VSIX. The container runs as
# ec2-user's UID, so what it writes in the checkout stays removable on the reused instance, with
# HOME in /tmp for npm's cache.
build:
  stage: build
  before_script:
    - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  script:
    - >-
      docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true
      -v "$CI_PROJECT_DIR:/app" -w /app "$NODE_IMAGE"
      sh -c 'npm ci && npm test && npx vsce package --out "agntree-$(node -p "require(\"./package.json\").version").vsix"'
  artifacts:
    paths:
      - agntree-*.vsix
    expire_in: 1 week

# A version is published once. Workspaces pin it, so replacing its file would change every new
# workspace without a template change; bump the version instead.
publish:
  stage: publish
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - version="${CI_COMMIT_TAG#v}"
    - file="agntree-$version.vsix"
    - test -f "$file" || { echo "The build made no $file. Does package.json say version $version?"; exit 1; }
    - url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agntree/$version/$file"
    - status=$(curl -sS -o /dev/null -w '%{http_code}' --header "JOB-TOKEN: $CI_JOB_TOKEN" "$url")
    - if [ "$status" = 200 ]; then echo "agntree $version is already published"; exit 1; fi
    - curl -fsS --retry 3 --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$url"
    - echo "Published $url"
